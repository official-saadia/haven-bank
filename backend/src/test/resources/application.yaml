# Test overrides. The mail credentials are dummies: SmtpEmailSender validates that the properties
# are present at startup but does not connect, so a context test can boot without a real mailbox.
spring:
  security:
    oauth2:
      authorizationserver:
        issuer: ${app.issuer}
        client:
          spa:
            require-proof-key: true
            require-authorization-consent: false
            registration:
              client-id: spa
              client-authentication-methods:
                - none
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - ${app.spa.redirect-uri}
              post-logout-redirect-uris:
                - ${app.spa.post-logout-uri}
              scopes:
                - openid
                - profile
                - accounts.read
                - transfers.write
            token:
              access-token-time-to-live: 5m
              refresh-token-time-to-live: 7d
              reuse-refresh-tokens: false
          # Test-only confidential client for FR-1.10 (refresh token rotation + reuse detection).
          # Spring Authorization Server deliberately never issues a refresh token to a client
          # registered with client-authentication-methods: none (the "spa" client above) -
          # refresh-token rotation is meaningless to test against a client that structurally never
          # receives one. This client can hold a secret (client_secret_basic), so it exercises the
          # real rotation/reuse-detection code path. Test-only: not present in main application.yaml,
          # never registered in any non-test environment.
          test-confidential:
            require-proof-key: true
            require-authorization-consent: false
            registration:
              client-id: test-confidential
              client-secret: "{noop}test-confidential-secret"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - ${app.spa.redirect-uri}
              scopes:
                - openid
                - profile
                - accounts.read
                - transfers.write
            token:
              access-token-time-to-live: 5m
              refresh-token-time-to-live: 7d
              reuse-refresh-tokens: false
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

app:
  # Declared explicitly for the test context: the production @Value bindings no longer carry
  # inline defaults, so the values must come from config in every environment, tests included.
  issuer: http://localhost:8080
  resource-id: banking-api
  spa:
    redirect-uri: http://localhost:5173/oauth/callback
    post-logout-uri: http://localhost:5173/?signedout
  verification:
    base-url: http://localhost:5173
    email-token-ttl: PT24H
    password-reset-token-ttl: PT1H
  notification:
    email:
      from: no-reply@havenbank.test
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Thresholds are configuration, not code (FR-6.6): during a credential-stuffing incident these
    # can be tightened and the service restarted, without waiting for a build.
    tiers:
      critical: # credential submission - guessable, so keyed by IP
        limit: ${RL_CRITICAL_LIMIT:25}
        window: PT1M
        key: ip
        backoff: true
        fail-closed: true             # no rate limiting means no brute-force protection
      sensitive: # authenticated writes: money movement, token exchange
        limit: ${RL_SENSITIVE_LIMIT:20}
        window: PT1M
        key: subject
        backoff: false
        fail-closed: true
      standard: # reads, and the pages that render credential forms
        limit: ${RL_STANDARD_LIMIT:100}
        window: PT1M
        key: subject
        backoff: false
        fail-closed: false